services:
  amul-protein-tracker:
    image: ghcr.io/jack101a/amul-protein-tracker:latest
    container_name: amul_protein_tracker
    restart: unless-stopped
    ports:
      - "${PORT:-8082}:8082"
    environment:
      - TZ=${TZ:-Asia/Kolkata}
      - NODE_ENV=${NODE_ENV:-production}
      - NODE_OPTIONS=${NODE_OPTIONS:---max-old-space-size=48 --expose-gc}
      - PORT=${PORT:-8082}
      - PINCODE=${PINCODE:-400068}
      - DISCORD_ENABLED=${DISCORD_ENABLED:-false}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - WHATSAPP_ENABLED=${WHATSAPP_ENABLED:-false}
      - WHATSAPP_PHONE=${WHATSAPP_PHONE:-}
      - WHATSAPP_APIKEY=${WHATSAPP_APIKEY:-}
    volumes:
      - ${CONFIG_PATH:-/srv/ajaxhs/config}/amul-protein-tracker/data:/app/data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 100M
        reservations:
          memory: 50M
    cpus: 0.5
    mem_limit: 100m
    networks:
      - ajax_network

networks:
  ajax_network:
    external: true
