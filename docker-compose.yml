services:
  amul-protein-tracker:
    image: ghcr.io/jack101a/amul-protein-tracker:latest
    container_name: amul_protein_tracker
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - TZ=Asia/Kolkata
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=64
      - PORT=8082
      - PINCODE=400068
      - DISCORD_ENABLED=true
      - DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/1562369001768615977/UE7oBJ98t7jcetEb0sEIEUnIkKe8PeHL1vXj-OTw96YT51URyBlEUY70WzdDwCNBCTw4
    volumes:
      - /srv/ajaxhs/config/amul-protein-tracker/data:/app/data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 100M
        reservations:
          memory: 50M
    cpus: 0.5
    mem_limit: 100m
    networks:
      - ajax_network

networks:
  ajax_network:
    external: true
